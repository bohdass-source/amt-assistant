name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (chunker, fusion, citations, sources.yaml, eval set)
        run: npm test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: POSTGRES_PASSWORD=ci JWT_SECRET=ci-secret-ci-secret-ci-secret docker compose config --quiet
      - name: Build api image
        run: docker build -f apps/api/Dockerfile -t amt-assistant-api:ci .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t amt-assistant-web:ci .
